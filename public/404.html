<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LLE Social Media — Listen | Learn | Engage</title>
    <script>
      /* GitHub Pages SPA fallback.
         Pages has no rewrites, so a direct visit to /about-us lands here
         with a 404 status. We bounce to the site directory with the
         route encoded as ?p=about-us; the boot script in index.html
         decodes it back into a clean /about-us path via replaceState.
         Works at a domain root and under a repo sub-path. */
      (function () {
        var routes = ["about-us", "medical-content", "website-designing"];
        var path = window.location.pathname;
        var clean = path.replace(/\/+$/, "");
        var seg = clean.split("/").pop() || "";
        if (routes.indexOf(seg) !== -1) {
          window.location.replace(
            clean.slice(0, clean.length - seg.length) +
              "?p=" +
              encodeURIComponent(seg)
          );
        } else {
          /* Unknown path — fall back to the site root. */
          window.location.replace(path.replace(/[^/]*$/, ""));
        }
      })();
    </script>
  </head>
  <body></body>
</html>
