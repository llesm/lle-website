<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LLE Social Media — a digital growth studio crafting websites, e-commerce and Shopify stores, medical content and mobile apps for brands that refuse to blend in."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10v80M15 30l70 40M85 30L15 70' stroke='%23FF4D2E' stroke-width='13' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Space+Mono:ital,wght@0,400;0,700&display=swap"
      rel="stylesheet"
    />
    <title>LLE Social Media — Listen | Learn | Engage</title>
    <style>
      html {
        background-color: #0f1013;
      }
    </style>
    <script>
      /* Runs before React: canonicalises the URL so the app always boots
         on a clean, SEO-friendly path.
         1) GitHub Pages bounce:  /?p=about-us  →  /about-us
         2) Legacy hash shares:   #/about-us    →  about-us (relative)   */
      (function () {
        var routes = [
          "about-us",
          "medical-content",
          "website-designing",
          "app-development",
          "ecommerce",
          "shopify",
        ];
        var loc = window.location;
        var q = new URLSearchParams(loc.search);
        var p = q.get("p");
        if (p && routes.indexOf(p) !== -1) {
          q.delete("p");
          var search = q.toString() ? "?" + q.toString() : "";
          var base = loc.pathname.replace(/\/?$/, "/");
          window.history.replaceState(null, "", base + p + search);
          return;
        }
        var seg = loc.hash.replace(/^#\/?/, "").split("?")[0].split("/")[0];
        if (routes.indexOf(seg) !== -1) {
          window.history.replaceState(null, "", seg);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
