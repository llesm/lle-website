# Deploys the Vite site to GitHub Pages on every push to main.
# Repo Settings → Pages → Source must be set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant the workflow permission to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Auto-locate the uploaded company logo wherever it lives in the repo
      # (root, assets/, images/ or public/) and stage it into public/ so the
      # build always picks it up. The site theme also re-colours itself from
      # this file at runtime.
      - name: Stage company logo
        run: |
          mkdir -p public
          for candidate in \
            "lle-LOGO2.png" \
            "lle-logo2.png" \
            "LLE-LOGO2.png" \
            "lle-logo.png" \
            "lle_LOGO2.png" \
            "llelogo2.png" \
            "logo-lle.png" \
            "logo.png" \
            "photos/lle-LOGO2.png" \
            "assets/lle-LOGO2.png" \
            "images/lle-LOGO2.png" \
            "public/images/lle-LOGO2.png"; do
            if [ -f "$candidate" ] && [ ! -f "public/lle-LOGO2.png" ]; then
              cp "$candidate" public/lle-LOGO2.png
              echo "Staged logo from $candidate"
            fi
          done
          if [ -f "public/lle-LOGO2.png" ]; then
            echo "Logo found and staged for build."
          else
            echo "::warning::No lle-LOGO2.png found in the repo — the site will use the fallback monogram."
          fi

      # Auto-locate the About-page hero background the same way (it lives in
      # the repo's photos/ folder).
      - name: Stage About hero background
        run: |
          for candidate in \
            "photos/about-us-bg-lleweb.png" \
            "about-us-bg-lleweb.png" \
            "assets/about-us-bg-lleweb.png" \
            "images/about-us-bg-lleweb.png" \
            "public/photos/about-us-bg-lleweb.png" \
            "public/images/about-us-bg-lleweb.png"; do
            if [ -f "$candidate" ] && [ ! -f "public/about-us-bg-lleweb.png" ]; then
              cp "$candidate" public/about-us-bg-lleweb.png
              echo "Staged About background from $candidate"
            fi
          done
          if [ -f "public/about-us-bg-lleweb.png" ]; then
            echo "About background found and staged for build."
          else
            echo "::warning::No about-us-bg-lleweb.png found — About hero will use the grid fallback."
          fi

      # --base=./ makes asset URLs relative, required for GitHub Pages
      - name: Build
        run: npx vite build --base=./

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
